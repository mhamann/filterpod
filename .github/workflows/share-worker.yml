# The filterpod.app share pages (web/share): test every change, deploy what lands on main.
name: Share worker

on:
  push:
    branches: [main]
    paths: ["web/share/**", "PRIVACY.md", ".github/workflows/share-worker.yml"]
  pull_request:
    paths: ["web/share/**", "PRIVACY.md", ".github/workflows/share-worker.yml"]

concurrency:
  group: share-worker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web/share

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/share/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: share-worker-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/share/package-lock.json
      - run: npm ci
      # Until the secrets exist, deploys stay manual rather than failing every push.
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
